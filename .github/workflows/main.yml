name: Build VEXORA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract VEXORA
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXORA-APK
          path: '**/build/outputs/apk/debug/*.apk'
